<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SeatMate</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f1f5f9;--accent:#0f172a;--blue:#eff6ff;--green:#ecfdf5;--orange:#fff7ed;--red:#fef2f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 96px}
h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 12px}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 28px rgba(15,23,42,.06);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}.btn.tiny{width:auto;padding:8px 10px;font-size:12px}.btn.danger{background:var(--red);color:#991b1b}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;background:#fff}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field{margin-bottom:12px}
.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700}
.safe{background:var(--blue);color:#1e3a8a;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.ok{background:var(--green);color:#166534;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.warn{background:var(--orange);color:#9a3412;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.tripitem{padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}.tripitem.active{border:2px solid var(--accent)}
.seats{display:flex;gap:8px;margin:16px 0}.seat{flex:1;text-align:center;padding:13px 4px;border-radius:14px;border:1px solid var(--line);background:#fafafa}.seat.you{background:var(--accent);color:#fff}.seat.target{border:2px solid var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--soft);padding:14px;border-radius:15px}.kpi b{display:block;margin-top:4px}
.stop{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}.stop.next{background:#fafafa;margin:0 -8px;padding:10px 8px;border-radius:12px}
.screen{display:none}.screen.active{display:block}.back{border:0;background:none;color:var(--muted);padding:8px 0;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;padding:9px 2px;font-size:11px;color:var(--muted)}
.historyItem{padding:10px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">

<section id="home" class="screen active">
<h1>SeatMate</h1><div class="small">Inference v11</div>

<div class="card">
<div class="row"><div class="grow"><h2>保存した乗車</h2><div class="small">最大5件</div></div><span id="count" class="badge"></span></div>
<div id="tripList"></div>
<button id="addBtn" class="btn primary" onclick="newTrip()">＋ 新しい列車を登録</button>
</div>

<div id="activeCard" style="display:none">
<div class="card">
<div class="row">
  <div class="grow">
    <div id="trainName" style="font-size:22px;font-weight:800"></div>
    <div id="route" class="muted"></div>
  </div>
  <span id="serviceBadge" class="badge"></span>
</div>

<div class="seats">
  <div id="seatYou" class="seat you"></div>
  <div id="seatTarget" class="seat target"></div>
  <div class="seat">—<br><span class="small">同列</span></div>
</div>

<div class="kpis">
  <div class="kpi"><span class="small">現在</span><b id="currentSection"></b></div>
  <div class="kpi"><span class="small">次駅</span><b id="nextStop"></b></div>
</div>

<div id="predictionCard" class="safe" style="margin-top:12px"></div>
<div id="inferenceCard" class="safe" style="margin-top:10px"></div>

<div id="acceptInferenceArea" style="display:none;margin-top:10px">
  <button class="btn" onclick="acceptInference()">推定駅を採用する</button>
</div>

<div style="height:12px"></div>
<button class="btn primary" onclick="show('check')">隣席を確認する</button>
<div style="height:8px"></div>
<button class="btn" onclick="show('ride')">停車駅を見る</button>
</div>
</div>
</section>

<section id="register" class="screen">
<button class="back" onclick="show('home')">← ホームに戻る</button>
<h1>列車登録</h1>
<div class="card">
<div class="field"><label>日付</label><input id="date" type="date"></div>
<div class="field"><label>列車名</label><input id="train"></div>
<div class="grid2"><div class="field"><label>乗車駅</label><input id="from"></div><div class="field"><label>降車駅</label><input id="to"></div></div>
<div class="grid2"><div class="field"><label>号車</label><input id="car"></div><div class="field"><label>座席</label><input id="seat"></div></div>
<div class="field"><label>隣席</label><input id="neighbor"></div>
<div class="field"><label>隣席が乗ってきそうな駅（任意）</label><input id="predictedStation"></div>
<div class="field"><label>通知タイミング</label>
<select id="notifyBefore">
<option value="0">通知なし</option>
<option value="5">5分前</option>
<option value="10" selected>10分前</option>
<option value="15">15分前</option>
<option value="20">20分前</option>
</select></div>
<div class="safe">停車駅・時刻は前バージョンで保存したデータを引き継ぎます。</div>
<div style="height:12px"></div>
<button class="btn primary" onclick="saveTrip()">保存</button>
</div>
</section>

<section id="ride" class="screen">
<button class="back" onclick="show('home')">← ホームに戻る</button>
<h1>停車駅</h1>
<div class="card"><h2 id="rideTitle"></h2><div id="stops"></div></div>
</section>

<section id="check" class="screen">
<button class="back" onclick="show('home')">← ホームに戻る</button>
<h1>座席確認</h1>

<div class="card">
<h2>おすすめ公式サービス</h2>
<b id="serviceName"></b>
<div class="safe" style="margin-top:12px">ログインが必要な場合はSafari / キーチェーンを利用してください。</div>
<div style="height:12px"></div>
<button class="btn primary" onclick="openService()">公式サイトを開く</button>
</div>

<div class="card">
<h2>確認地点</h2>
<div class="field"><label>どの駅の手前/付近で確認したか</label>
<select id="checkedAtStation"></select></div>
<div class="small">この情報を使って「どの駅から状態が変わったか」を推定します。</div>
</div>

<div class="card">
<h2>確認結果</h2>
<div class="grid2">
<button class="btn" onclick="record('空席')">○ 空席</button>
<button class="btn" onclick="record('使用不可')">× 使用不可</button>
</div>
<div style="height:8px"></div>
<button class="btn" onclick="record('不明')">? 不明</button>
</div>

<div class="card">
<h2>検索に使う情報</h2>
<div id="copyRows"></div>
</div>
</section>

<section id="history" class="screen">
<h1>履歴</h1>
<div class="card"><div id="historyList"></div></div>
</section>

<section id="settings" class="screen">
<h1>設定</h1>
<div class="card">
<div class="safe">v11では履歴から乗車駅候補を推定します。推定は断定ではなく、ユーザーが採用して初めて通知対象になります。</div>
<div style="height:8px"></div>
<button class="btn danger" onclick="clearAll()">保存データを削除</button>
</div>
</section>

</div>

<div class="nav"><div class="navin">
<button onclick="show('home')">ホーム</button>
<button onclick="show('ride')">停車駅</button>
<button onclick="show('check')">座席確認</button>
<button onclick="show('history')">履歴</button>
<button onclick="show('settings')">設定</button>
</div></div>

<script>
let trips=JSON.parse(localStorage.getItem('sm_trips')||'[]');
let activeId=localStorage.getItem('sm_active')||null;
let history=JSON.parse(localStorage.getItem('sm_hist')||'[]');
let editing=null;
let latestInference=null;

const services=[
{id:'smart-ex',test:/のぞみ|ひかり|こだま|みずほ|さくら|つばめ/i,name:'スマートEX',url:'https://smart-ex.jp/'},
{id:'eki-net',test:/はくたか|かがやき|あさま|とき|たにがわ|やまびこ|はやぶさ|こまち|つばさ|なすの/i,name:'えきねっと',url:'https://www.eki-net.com/'},
{id:'e5489',test:/サンダーバード|しらさぎ|くろしお|やくも|はるか|こうのとり|きのさき|はしだて|まいづる/i,name:'e5489',url:'https://www.jr-odekake.net/goyoyaku/e5489/'},
{id:'jrkyushu',test:/ソニック|にちりん|かもめ|ゆふ|ゆふいんの森|きりしま|みどり|ハウステンボス/i,name:'JR九州ネット予約',url:'https://www.jrkyushu.co.jp/railway/netyoyaku/'}
];

function svc(n){return services.find(s=>s.test.test(n))||{id:'other',name:'JR公式予約サービス',url:'https://www.jr-central.co.jp/'}}
function active(){return trips.find(t=>t.id===activeId)||trips[0]||null}
function uid(){return't'+Date.now()}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');render();scrollTo(0,0)}
function copy(v){navigator.clipboard.writeText(v).then(()=>alert('コピーしました：'+v)).catch(()=>prompt('コピーしてください',v))}
function calcNeighbor(s){let m=String(s).toUpperCase().match(/^(\d+)([A-E])$/);if(!m)return'';let map={A:'B',B:'A',C:'B',D:'E',E:'D'};return m[1]+(map[m[2]]||'')}
function newTrip(){if(trips.length>=5)return alert('保存は5件までです');editing=null;clearForm();show('register')}
function clearForm(){let d=new Date(),z=n=>String(n).padStart(2,'0');date.value=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;train.value='';from.value='';to.value='';car.value='';seat.value='';neighbor.value='';predictedStation.value='';notifyBefore.value='10'}
function saveTrip(){
 if(seat.value&&!neighbor.value)neighbor.value=calcNeighbor(seat.value);
 const old=editing?trips.find(t=>t.id===editing):null;
 const o={id:editing||uid(),date:date.value,train:train.value.trim(),from:from.value.trim(),to:to.value.trim(),car:car.value.trim(),seat:seat.value.trim(),neighbor:neighbor.value.trim(),predictedStation:predictedStation.value.trim(),notifyBefore:Number(notifyBefore.value),stops:old?.stops||[]};
 if(editing)trips[trips.findIndex(x=>x.id===editing)]=o;else trips.push(o);
 activeId=o.id;persist();show('home')
}
function persist(){localStorage.setItem('sm_trips',JSON.stringify(trips));if(activeId)localStorage.setItem('sm_active',activeId)}
function selectTrip(id){activeId=id;persist();render()}
function delTrip(id){if(!confirm('削除しますか？'))return;trips=trips.filter(t=>t.id!==id);if(activeId===id)activeId=trips[0]?.id||null;persist();render()}
function openService(){let t=active();if(t)window.open(svc(t.train).url,'_blank')}
function clearAll(){if(confirm('すべて削除しますか？')){localStorage.clear();location.reload()}}

function hmToMinutes(v){
 if(!v)return null;
 const m=String(v).match(/(\d{1,2}):(\d{2})/);
 return m?Number(m[1])*60+Number(m[2]):null
}
function nowMinutes(){let d=new Date();return d.getHours()*60+d.getMinutes()}

function timelineState(t){
 const st=t.stops||[];
 if(!st.length)return{current:'時刻表なし',next:'-',minutes:null,nextName:null};
 const now=nowMinutes();

 for(let i=0;i<st.length;i++){
   const target=hmToMinutes(st[i].arr)||hmToMinutes(st[i].dep);
   if(target!==null&&target>=now){
     const prev=st[Math.max(0,i-1)];
     return{
       current:i===0?st[0].name:`${prev.name} → ${st[i].name}`,
       next:`${st[i].name} ${st[i].arr||st[i].dep||''}`,
       minutes:Math.max(0,target-now),
       nextName:st[i].name
     };
   }
 }
 return{current:'終着後',next:'到着済み',minutes:null,nextName:null}
}

function record(status){
 const t=active();if(!t)return;
 const station=checkedAtStation.value||'未指定';
 history.unshift({
   id:uid(),
   ts:new Date().toISOString(),
   train:t.train,
   tripId:t.id,
   seat:t.neighbor,
   status,
   station,
   time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})
 });
 localStorage.setItem('sm_hist',JSON.stringify(history));
 render();
 alert(`記録しました：${station} / ${status}`);
}

function inferBoardingStation(t){
 const records=history
   .filter(h=>h.tripId===t.id && h.seat===t.neighbor && (h.status==='空席'||h.status==='使用不可'))
   .slice()
   .reverse();

 if(records.length<2)return null;

 let lastEmpty=null;
 for(const r of records){
   if(r.status==='空席')lastEmpty=r;
   if(r.status==='使用不可' && lastEmpty){
     const stopNames=(t.stops||[]).map(s=>s.name);
     const emptyIdx=stopNames.indexOf(lastEmpty.station);
     const busyIdx=stopNames.indexOf(r.station);

     let candidate=r.station;
     let confidence='中';

     if(emptyIdx>=0 && busyIdx>=0 && busyIdx>emptyIdx){
       candidate=stopNames[busyIdx];
       confidence=(busyIdx-emptyIdx===1)?'高':'中';
     }

     return{
       station:candidate,
       from:lastEmpty.station,
       to:r.station,
       confidence,
       message:`${lastEmpty.station}では空席、${r.station}では使用不可でした。${candidate}付近から使用された可能性があります。`
     };
   }
 }
 return null;
}

function acceptInference(){
 const t=active();if(!t||!latestInference)return;
 t.predictedStation=latestInference.station;
 trips=trips.map(x=>x.id===t.id?t:x);
 persist();
 render();
 alert(`${latestInference.station}を隣席乗車予測駅として採用しました。`);
}

function predictionState(t){
 if(!t.predictedStation)return{message:'隣席の乗車駅は未設定です。',soon:false};
 const stop=(t.stops||[]).find(s=>s.name===t.predictedStation);
 if(!stop)return{message:`${t.predictedStation}を停車駅一覧で確認できません。`,soon:false};
 const m=hmToMinutes(stop.arr)||hmToMinutes(stop.dep);
 if(m===null)return{message:`${t.predictedStation}の時刻が未登録です。`,soon:false};
 const diff=m-nowMinutes();
 if(diff<0)return{message:`${t.predictedStation}は通過済みです。`,soon:false};
 if(diff<=Number(t.notifyBefore||10))return{message:`${t.predictedStation}まであと約${diff}分。隣席 ${t.neighbor} に乗車がある可能性があります。`,soon:true};
 return{message:`${t.predictedStation}から隣席 ${t.neighbor} が使用される可能性があります。あと約${diff}分。`,soon:false}
}

function maybeNotify(t){
 if(!t||!t.predictedStation||!t.notifyBefore)return;
 const p=predictionState(t);
 if(!p.soon)return;
 const key=`pred_${t.id}_${t.predictedStation}`;
 if(sessionStorage.getItem(key))return;
 sessionStorage.setItem(key,'1');
 setTimeout(()=>alert(p.message),250);
}

function render(){
 let t=active();

 count.textContent=trips.length+'/5';
 addBtn.disabled=trips.length>=5;
 addBtn.style.opacity=trips.length>=5?.5:1;

 tripList.innerHTML=trips.length?trips.map(x=>`<div class="tripitem ${x.id===activeId?'active':''}">
 <div class="row"><div class="grow"><b>${x.train||'列車名未設定'}</b><div class="small">${x.date} ${x.from}→${x.to}</div><div class="small">${x.car}号車 ${x.seat}</div></div><button class="btn tiny" onclick="selectTrip('${x.id}')">選択</button></div>
 <div style="height:8px"></div><button class="btn tiny danger" onclick="delTrip('${x.id}')">削除</button></div>`).join(''):'<div class="muted">まだ保存した乗車はありません。</div>';

 activeCard.style.display=t?'block':'none';

 historyList.innerHTML=history.length?history.map(h=>`<div class="historyItem"><b>${h.train}</b><div>${h.station} / ${h.time}</div><div>${h.seat}：${h.status}</div></div>`).join(''):'まだ履歴はありません。';

 if(!t)return;

 const s=svc(t.train),ts=timelineState(t),ps=predictionState(t);
 latestInference=inferBoardingStation(t);

 trainName.textContent='🚄 '+t.train;
 route.textContent=t.from+' → '+t.to;
 serviceBadge.textContent=s.name;
 seatYou.innerHTML=t.seat+'<br><span class="small" style="color:#fff">YOU</span>';
 seatTarget.innerHTML=t.neighbor+'<br><span class="small">隣席</span>';
 currentSection.textContent=ts.current;
 nextStop.textContent=ts.next;

 predictionCard.className=ps.soon?'warn':'safe';
 predictionCard.textContent=ps.message;

 if(latestInference){
   inferenceCard.className='ok';
   inferenceCard.textContent=`自動推定（信頼度 ${latestInference.confidence}）：${latestInference.message}`;
   acceptInferenceArea.style.display=t.predictedStation===latestInference.station?'none':'block';
 }else{
   inferenceCard.className='safe';
   inferenceCard.textContent='確認履歴が2件以上たまると、空席→使用不可の変化から乗車駅候補を推定します。';
   acceptInferenceArea.style.display='none';
 }

 rideTitle.textContent=t.train;
 serviceName.textContent=s.name;

 checkedAtStation.innerHTML='<option value="">未指定</option>'+((t.stops||[]).map(x=>`<option value="${x.name}" ${x.name===ts.nextName?'selected':''}>${x.name}</option>`).join(''));

 stops.innerHTML=t.stops?.length?t.stops.map(x=>`<div class="stop ${x.name===ts.nextName?'next':''}">
 <div><b>${x.name}</b><div class="small">${x.arr?'着 '+x.arr:''} ${x.dep?'発 '+x.dep:''}</div></div>
 <button class="btn tiny" onclick="copy('${x.name}')">コピー</button></div>`).join(''):'<div class="muted">停車駅がありません。</div>';

 let rows=[['出発駅',t.from],['到着駅',t.to],['日付',t.date],['列車',t.train],['確認席',`${t.car}号車 ${t.neighbor}`]];
 copyRows.innerHTML=rows.map(([k,v])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #e5e7eb"><div class="grow"><div class="small">${k}</div><b>${v}</b></div><button class="btn tiny" onclick="copy('${v}')">コピー</button></div>`).join('');

 maybeNotify(t);
}

if(trips.length&&!activeId){activeId=trips[0].id;persist()}
render();
setInterval(render,30000);

if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
