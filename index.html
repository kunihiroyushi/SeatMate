<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SeatMate</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f1f5f9;--accent:#0f172a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 96px}
h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 12px}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 28px rgba(15,23,42,.06);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}.btn.tiny{width:auto;padding:8px 10px;font-size:12px}.btn.danger{background:#fef2f2;color:#991b1b}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;background:#fff}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field{margin-bottom:12px}
.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700}
.tripitem{padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}.tripitem.active{border:2px solid var(--accent)}
.seats{display:flex;gap:8px;margin:16px 0}.seat{flex:1;text-align:center;padding:13px 4px;border-radius:14px;border:1px solid var(--line);background:#fafafa}.seat.you{background:var(--accent);color:#fff}.seat.target{border:2px solid var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--soft);padding:14px;border-radius:15px}.kpi b{display:block;margin-top:4px}
.timeline .stop{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;align-items:center;border-bottom:1px solid var(--line)}
.safe{background:#eff6ff;color:#1e3a8a;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.screen{display:none}.screen.active{display:block}.back{width:auto;background:transparent;padding:8px 0;font-size:14px;color:var(--muted);border:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;padding:9px 2px;font-size:11px;color:var(--muted)}.nav button.active{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
<h1>SeatMate</h1><div class="small">乗車中アシスタント v3</div>
<div class="card">
<div class="row"><div class="grow"><h2>保存した乗車</h2><div class="small">最大5件</div></div><span id="count" class="badge"></span></div>
<div id="tripList"></div>
<button id="addBtn" class="btn primary" onclick="newTrip()">＋ 新しい列車を登録</button>
</div>
<div id="activeCard" style="display:none">
<div class="card">
<div class="row"><div class="grow"><div id="trainName" style="font-size:22px;font-weight:800"></div><div id="route" class="muted"></div></div><span id="serviceBadge" class="badge"></span></div>
<div class="seats"><div id="seatYou" class="seat you"></div><div id="seatTarget" class="seat target"></div><div class="seat">—<br><span class="small">同列</span></div></div>
<div class="kpis"><div class="kpi"><span class="small">現在</span><b id="current"></b></div><div class="kpi"><span class="small">次駅</span><b id="next"></b></div></div>
<div style="height:12px"></div><button class="btn primary" onclick="show('check')">隣席を確認する</button>
<div style="height:8px"></div><button class="btn" onclick="editActive()">この乗車を編集</button>
</div>
</div>
</section>

<section id="register" class="screen">
<button class="back" onclick="show('home')">← ホームに戻る</button>
<h1 id="regTitle">列車登録</h1><div class="small">保存は最大5件まで</div>
<div class="card">
<div class="field"><label>日付</label><input id="date" type="date"></div>
<div class="field"><label>列車名</label><input id="train"></div>
<div class="grid2"><div class="field"><label>乗車駅</label><input id="from"></div><div class="field"><label>降車駅</label><input id="to"></div></div>
<div class="grid2"><div class="field"><label>号車</label><input id="car"></div><div class="field"><label>座席</label><input id="seat"></div></div>
<div class="field"><label>隣席</label><input id="neighbor"></div>
<div class="field"><label>隣席が乗ってきそうな駅（任意）</label><input id="predictedStation"></div>
<button class="btn primary" onclick="saveTrip()">保存する</button>
</div>
</section>

<section id="ride" class="screen">
<button class="back" onclick="show('home')">← ホームに戻る</button>
<h1>乗車中</h1>
<div class="card"><h2 id="rideTitle"></h2><div id="stops" class="timeline"></div></div>
</section>

<section id="check" class="screen">
<button class="back" onclick="show('home')">← ホームに戻る</button>
<h1>座席確認</h1><div id="checkTarget" class="small"></div>
<div class="card"><h2>おすすめ公式サービス</h2><b id="serviceName"></b><div id="serviceReason" class="small"></div><div id="loginHint" class="safe" style="margin-top:12px"></div><div style="height:12px"></div><button class="btn primary" onclick="openService()">公式サイトを開く</button><div style="height:8px"></div><button class="btn" onclick="show('accounts')">ログイン設定を見る</button></div>
<div class="card"><h2>検索に使う情報</h2><div id="copyRows"></div></div>
<div class="card"><h2>確認結果</h2><div class="grid2"><button class="btn" onclick="record('空席')">○ 空席</button><button class="btn" onclick="record('使用不可')">× 使用不可</button></div></div>
</section>

<section id="accounts" class="screen">
<button class="back" onclick="show('check')">← 座席確認に戻る</button>
<h1>ログイン設定</h1>
<div class="card"><div class="safe">SeatMateにはパスワードを保存しません。ログインID/メールだけ任意保存し、パスワードはSafari/キーチェーンの自動入力を利用する想定です。</div></div>
<div id="accountCards"></div>
</section>

<section id="history" class="screen">
<h1>履歴</h1><div class="card"><div id="historyList"></div></div>
</section>

<section id="settings" class="screen">
<h1>設定</h1>
<div class="card"><button class="btn" onclick="show('accounts')">ログイン設定</button><div style="height:8px"></div><button class="btn danger" onclick="clearAll()">保存データを削除</button></div>
</section>
</div>

<div class="nav"><div class="navin">
<button onclick="show('home',this)">ホーム</button><button onclick="show('ride',this)">乗車中</button><button onclick="show('check',this)">座席確認</button><button onclick="show('history',this)">履歴</button><button onclick="show('settings',this)">設定</button>
</div></div>

<script>
const stops=[['敦賀','10:58'],['金沢','11:57'],['新高岡','12:12'],['富山','12:21'],['上越妙高','13:01'],['長野','13:21'],['高崎','14:03'],['大宮','14:27'],['上野','14:46'],['東京','14:52']];
const services=[
{id:'smart-ex',test:/のぞみ|ひかり|こだま|みずほ|さくら|つばめ/i,name:'スマートEX',url:'https://smart-ex.jp/',reason:'東海道・山陽・九州新幹線向け'},
{id:'eki-net',test:/はくたか|かがやき|あさま|とき|たにがわ|やまびこ|はやぶさ|こまち|つばさ|なすの/i,name:'えきねっと',url:'https://www.eki-net.com/',reason:'JR東日本系新幹線向け'},
{id:'e5489',test:/サンダーバード|しらさぎ|くろしお|やくも|はるか/i,name:'e5489',url:'https://www.jr-odekake.net/goyoyaku/e5489/',reason:'JR西日本エリアの特急向け'},
{id:'jrkyushu',test:/ソニック|にちりん|かもめ|ゆふ|ゆふいんの森|きりしま|みどり/i,name:'JR九州ネット予約',url:'https://www.jrkyushu.co.jp/railway/netyoyaku/',reason:'JR九州の特急向け'}
];
let trips=JSON.parse(localStorage.getItem('sm_trips')||'[]');
let activeId=localStorage.getItem('sm_active')||null;
let history=JSON.parse(localStorage.getItem('sm_hist')||'[]');
let accounts=JSON.parse(localStorage.getItem('sm_accounts')||'{}');
let editing=null;

function svc(train){return services.find(s=>s.test.test(train))||{id:'other',name:'JR公式予約サービス',url:'https://www.jreast.co.jp/',reason:'列車に応じて公式サービスを確認'}}
function active(){return trips.find(t=>t.id===activeId)||trips[0]||null}
function uid(){return 't'+Date.now()}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');render();scrollTo(0,0)}
function copy(v){navigator.clipboard.writeText(v).then(()=>alert('コピーしました：'+v)).catch(()=>prompt('コピーしてください',v))}
function newTrip(){if(trips.length>=5){alert('保存は5件までです');return}editing=null;clearForm();regTitle.textContent='列車登録';show('register')}
function editActive(){let t=active();if(!t)return;editing=t.id;fill(t);regTitle.textContent='列車編集';show('register')}
function clearForm(){let d=new Date(),z=n=>String(n).padStart(2,'0');date.value=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;train.value='';from.value='';to.value='';car.value='';seat.value='';neighbor.value='';predictedStation.value=''}
function fill(t){date.value=t.date;train.value=t.train;from.value=t.from;to.value=t.to;car.value=t.car;seat.value=t.seat;neighbor.value=t.neighbor;predictedStation.value=t.predictedStation||''}
function saveTrip(){let o={id:editing||uid(),date:date.value,train:train.value,from:from.value,to:to.value,car:car.value,seat:seat.value,neighbor:neighbor.value,predictedStation:predictedStation.value,stops};if(editing){trips[trips.findIndex(x=>x.id===editing)]=o}else trips.push(o);activeId=o.id;persist();show('home')}
function persist(){localStorage.setItem('sm_trips',JSON.stringify(trips));if(activeId)localStorage.setItem('sm_active',activeId)}
function selectTrip(id){activeId=id;persist();render()}
function delTrip(id){if(!confirm('削除しますか？'))return;trips=trips.filter(t=>t.id!==id);if(activeId===id)activeId=trips[0]?.id||null;persist();render()}
function saveAccount(id){accounts[id]={loginId:document.getElementById('acct_'+id).value};localStorage.setItem('sm_accounts',JSON.stringify(accounts));alert('IDを保存しました');render()}
function openService(){let t=active();if(t)window.open(svc(t.train).url,'_blank')}
function record(status){let t=active();if(!t)return;history.unshift({train:t.train,seat:t.neighbor,status,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('sm_hist',JSON.stringify(history));render();alert('記録しました')}
function clearAll(){if(confirm('すべて削除しますか？')){localStorage.clear();location.reload()}}
function render(){
let t=active();count.textContent=trips.length+'/5';addBtn.disabled=trips.length>=5;addBtn.style.opacity=trips.length>=5?.5:1;
tripList.innerHTML=trips.length?trips.map(x=>`<div class="tripitem ${x.id===activeId?'active':''}"><div class="row"><div class="grow"><b>${x.train}</b><div class="small">${x.date} ${x.from}→${x.to}</div><div class="small">${x.car}号車 ${x.seat}</div></div><button class="btn tiny" onclick="selectTrip('${x.id}')">選択</button></div><div style="height:8px"></div><button class="btn tiny danger" onclick="delTrip('${x.id}')">削除</button></div>`).join(''):'<div class="muted">まだ保存した乗車はありません。</div>';
activeCard.style.display=t?'block':'none';
accountCards.innerHTML=services.map(s=>`<div class="card"><h2>${s.name}</h2><input id="acct_${s.id}" value="${accounts[s.id]?.loginId||''}" placeholder="ログインID / メール"><div style="height:8px"></div><button class="btn" onclick="saveAccount('${s.id}')">IDを保存</button></div>`).join('');
historyList.innerHTML=history.length?history.map(h=>`<div style="padding:10px 0;border-bottom:1px solid #e5e7eb"><b>${h.train}</b><div>${h.time} ${h.seat}：${h.status}</div></div>`).join(''):'まだ履歴はありません。';
if(!t)return;
let s=svc(t.train);trainName.textContent='🚄 '+t.train;route.textContent=t.from+' → '+t.to;serviceBadge.textContent=s.name;seatYou.innerHTML=t.seat+'<br><span class="small" style="color:#fff">YOU</span>';seatTarget.innerHTML=t.neighbor+'<br><span class="small">隣席</span>';
current.textContent='上越妙高 → 長野';next.textContent='長野 13:21';rideTitle.textContent=t.train;checkTarget.textContent=`確認対象：${t.car}号車 ${t.neighbor}`;serviceName.textContent=s.name;serviceReason.textContent=s.reason;
loginHint.textContent=accounts[s.id]?.loginId?`保存済みログインID：${accounts[s.id].loginId}（パスワードはSafari/キーチェーン）`:'ログインIDは未登録です。';
stops.innerHTML=t.stops.map(([n,tm])=>`<div class="stop"><div><b>${n}</b><div class="small">${tm}</div></div><button class="btn tiny" onclick="copy('${n}')">コピー</button></div>`).join('');
let rows=[['出発駅',t.from],['到着駅',t.to],['日付',t.date],['列車',t.train],['確認席',`${t.car}号車 ${t.neighbor}`]];
copyRows.innerHTML=rows.map(([k,v])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #e5e7eb"><div class="grow"><div class="small">${k}</div><b>${v}</b></div><button class="btn tiny" onclick="copy('${v}')">コピー</button></div>`).join('');
}
if(trips.length&&!activeId){activeId=trips[0].id;persist()}render();
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body></html>
